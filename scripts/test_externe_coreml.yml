# Test externe en CoreML (format de l'iPhone) sur le Mac de GitHub Actions.
# Lancement manuel uniquement : onglet Actions -> "Test externe CoreML" -> Run workflow -> branche distillation.
# Compare FP16 416 (non quantifié) et INT8 416 (déployé) sur les images externes, avec le même script d6.
name: Test externe CoreML

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: pip install "ultralytics>=8.3" coremltools scipy

      - name: Exporter la distillée en CoreML (FP16 416 et INT8 416)
        run: |
          mkdir -p exports
          python - <<'EOF'
          import shutil
          from ultralytics import YOLO
          for name, kw in {"fp16_416": {"half": True}, "int8_416": {"int8": True}}.items():
              p = YOLO("model/best_distill.pt").export(format="coreml", imgsz=416, nms=True, **kw)
              shutil.move(p, f"exports/coreml_{name}.mlpackage")
          EOF

      - name: Télécharger les images externes (Release GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download dataset-externe -p confirmation_50.zip
          mkdir -p datasets_externe
          unzip -q confirmation_50.zip -d datasets_externe

      - name: Test externe (même script que d6)
        run: |
          python distillation/d6_externe.py \
            --images datasets_externe/confirmation_50 \
            --a exports/coreml_fp16_416.mlpackage \
            --b exports/coreml_int8_416.mlpackage \
            --tag coreml_confirmation

      - name: Sauvegarder le résultat
        uses: actions/upload-artifact@v4
        with:
          name: test-externe-coreml
          path: results/d6_coreml_confirmation.json