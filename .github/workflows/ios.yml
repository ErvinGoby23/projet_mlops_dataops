name: Build iOS (ASL ONNX)

on:
  push:
    branches: [onnx-iphone]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le modèle ONNX
        run: |
          test -f app/assets/onnx/asl_int8_416.onnx
          shasum -a 256 app/assets/onnx/asl_int8_416.onnx

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet iOS
        working-directory: app
        run: |
          flutter create --platforms=ios --org com.ervin --project-name asl_signes .
          rm -rf test
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'La caméra sert à reconnaître les lettres de la langue des signes.'" ios/Runner/Info.plist
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/com\.ervin\.aslSignes/com.ervin.aslOnnx/g' ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'ASL ONNX'" ios/Runner/Info.plist
          flutter pub get
          flutter build ios --config-only --release --no-codesign || true
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^#* *platform :ios.*/platform :ios, '16.0'/" ios/Podfile
            (cd ios && pod install)
          fi

      - name: Compiler (sans signature)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Créer le fichier .ipa
        run: |
          mkdir -p dist/Payload
          cp -R app/build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry ASL-ONNX.ipa Payload

      - name: Télécharger l'app (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: ASL-ONNX-ipa
          path: dist/ASL-ONNX.ipa
